<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> 💊 Shop Counter – Stock &amp; Billing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2ef;--surface:#fff;--ink:#14221f;--muted:#5b6b66;--line:#d5dfda;--brand:#0f5c52;--brand-ink:#fff;--warn-bg:#fdf1d6;--warn:#8a5a00;--bad-bg:#fde6e4;--bad:#b3261e;--ok:#1e7b4f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--surface:#17221f;--ink:#e6efec;--muted:#9ab0a9;--line:#2a3a36;--brand:#4cc3ae;--brand-ink:#06201b;--warn-bg:#3a2e10;--warn:#f0c36a;--bad-bg:#3d1a17;--bad:#ff9d94;--ok:#6fd3a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1715;--surface:#17221f;--ink:#e6efec;--muted:#9ab0a9;--line:#2a3a36;--brand:#4cc3ae;--brand-ink:#06201b;--warn-bg:#3a2e10;--warn:#f0c36a;--bad-bg:#3d1a17;--bad:#ff9d94;--ok:#6fd3a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{font-size:1.7rem;font-weight:800}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px}
nav button{border:0;background:none;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.alert{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.alert.hidden{display:none}
.alert strong{font-weight:700}
.alert button{margin-left:8px;border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:1.2rem;margin-bottom:10px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;max-height:460px;overflow:auto}
.tile{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;cursor:pointer}
.tile:hover:not(:disabled){border-color:var(--brand)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile b{display:block}
.tile small{color:var(--muted)}
.low{color:var(--warn);font-weight:600}
.out{color:var(--bad);font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.85rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.total{display:flex;justify-content:space-between;font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;font-weight:800;margin:12px 0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--bg);color:var(--ok)}.pill.low{background:var(--warn-bg);color:var(--warn)}.pill.out{background:var(--bad-bg);color:var(--bad)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.stats{display:flex;gap:24px;margin-bottom:12px}
.stats b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;display:block}
.stats span{color:var(--muted);font-size:.85rem}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:18px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.receipt{font-family:"Courier New",monospace;font-size:.88rem;line-height:1.45}
.receipt h3{text-align:center;font-size:1.1rem}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed var(--muted);margin:8px 0}
.receipt .l{display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;display:none;max-width:90vw}
.toast.show{display:block}
#printArea{display:none}
@media print{
  body{background:#fff}
  .wrap,.backdrop,.toast{display:none!important}
  #printArea{display:block;color:#000;max-width:320px;margin:0 auto}
}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shop Counter</h1>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" data-tab="bill" aria-selected="true">Billing</button>
      <button role="tab" data-tab="stock" aria-selected="false">Stock</button>
      <button role="tab" data-tab="sales" aria-selected="false">Bills</button>
    </nav>
  </header>
  <div id="alert" class="alert hidden" role="alert"></div>

  <section id="tab-bill" class="grid">
    <div class="panel">
      <h2>Add items to the bill</h2>
      <label for="search">Search by name or code</label>
      <input id="search" type="search" placeholder="e.g. rice, SKU-102" autocomplete="off">
      <div id="tiles" class="tiles">####</div>
    </div>
    <div class="panel">
      <h2>Current bill</h2>
      <label for="cust">Customer name (optional)</label>
      <input id="cust" placeholder="Walk-in customer" autocomplete="off">
      <div id="cart" class="scroll"></div>
      <div class="total"><span>Total</span><span id="grand">₹0.00</span></div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" id="checkout" style="flex:1">Save and print bill</button>
        <button class="btn" id="clear">Clear</button>
      </div>
    </div>
  </section>

  <section id="tab-stock" hidden>
    <div class="panel" style="margin-bottom:16px">
      <h2 id="formTitle">Add an item</h2>
      <form id="itemForm" onsubmit="return false">
        <div class="row">
          <div><label for="fName">Item name</label><input id="fName" required></div>
          <div><label for="fCode">Code</label><input id="fCode" placeholder="Auto if empty"></div>
          <div><label for="fPrice">Price (₹)</label><input id="fPrice" type="number" min="0" step="0.01" required></div>
          <div><label for="fStock">Stock on hand</label><input id="fStock" type="number" min="0" step="1" required></div>
          <div><label for="fMin">Alert when stock is at or below</label><input id="fMin" type="number" min="0" step="1" value="5" required></div>
        </div>
        <button class="btn primary" id="saveItem" type="button">Save item</button>
        <button class="btn" id="cancelEdit" type="button" hidden>Cancel edit</button>
      </form>
    </div>
    <div class="panel">
      <h2>All items</h2>
      <div class="scroll"><table>
        <thead><tr><th>Item</th><th class="n">Price</th><th class="n">Stock</th><th>Status</th><th>Add stock</th><th></th></tr></thead>
        <tbody id="stockBody"></tbody>
      </table></div>
    </div>
  </section>

  <section id="tab-sales" hidden>
    <div class="panel">
      <h2>🛎Bills</h2>
      <div class="stats"><div><b id="stToday">₹0.00</b><span>Sales today</span></div><div><b id="stCount">0</b><span>Bills today</span></div></div>
      <div class="scroll"><table>
        <thead><tr><th>Bill no.</th><th>Date</th><th>Customer</th><th class="n">Amount</th><th></th></tr></thead>
        <tbody id="salesBody"></tbody>
      </table></div>
    </div>
  </section>
</div>

<div class="backdrop" id="modal"><div class="modal">
  <div class="receipt" id="receiptView"></div>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn primary" id="printBtn" style="flex:1">Print bill</button>
    <button class="btn" id="closeModal">Close</button>
  </div>
</div></div>
<div id="printArea" class="receipt"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var KEY='shopcounter.v1';
  var STORE_NAME='My Kirana Store';
  var state={items:[],sales:[],seq:1};
  var cart=[];            // {id, qty}
  var editingId=null;
  var delArm=null;        // item id armed for delete
  var currentSale=null;

  function load(){
    try{var raw=localStorage.getItem(KEY);if(raw){state=JSON.parse(raw);return}}catch(e){}
    state={seq:1,sales:[],items:[
      {id:'i1',code:'RICE-5',name:'Basmati rice 5 kg',price:520,stock:14,min:5},
      {id:'i2',code:'ATTA-5',name:'Wheat flour 5 kg',price:245,stock:4,min:6},
      {id:'i3',code:'OIL-1',name:'Sunflower oil 1 L',price:162,stock:20,min:6},
      {id:'i4',code:'SUG-1',name:'Sugar 1 kg',price:48,stock:3,min:8},
      {id:'i5',code:'TEA-250',name:'Tea powder 250 g',price:110,stock:12,min:4},
      {id:'i6',code:'SOAP',name:'Bath soap',price:38,stock:0,min:10}
    ]};
    save();
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function $(s){return document.querySelector(s)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function money(n){return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function byId(id){return state.items.find(function(i){return i.id===id})}
  function toast(msg){var t=$('#toast');t.textContent=msg;t.className='toast show';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className='toast'},3500)}
  function status(i){return i.stock<=0?'out':(i.stock<=i.min?'low':'ok')}

  /* ---------- Alerts ---------- */
  function renderAlert(){
    var low=state.items.filter(function(i){return i.stock<=i.min});
    var el=$('#alert');
    if(!low.length){el.className='alert hidden';return}
    el.className='alert';
    el.innerHTML='<strong>'+low.length+' item'+(low.length>1?'s need':' needs')+' restocking:</strong> '+
      low.map(function(i){return esc(i.name)+' ('+i.stock+' left)'}).join(', ')+
      '<button data-go="stock">Open stock</button>';
  }

  /* ---------- Billing ---------- */
  function renderTiles(){
    var q=$('#search').value.trim().toLowerCase();
    var list=state.items.filter(function(i){return !q||i.name.toLowerCase().includes(q)||i.code.toLowerCase().includes(q)});
    $('#tiles').innerHTML=list.length?list.map(function(i){
      var s=status(i);
      return '<button class="tile" data-add="'+i.id+'"'+(i.stock<=0?' disabled':'')+'><b>'+esc(i.name)+'</b>'+
        '<small>'+money(i.price)+'</small><br><small class="'+(s==='ok'?'':s)+'">'+(i.stock<=0?'Out of stock':i.stock+' in stock')+'</small></button>';
    }).join(''):'<div class="empty">No items match. Add it on the Stock tab.</div>';
  }
  function cartTotal(){return cart.reduce(function(t,l){var i=byId(l.id);return t+(i?i.price*l.qty:0)},0)}
  function renderCart(){
    if(!cart.length){$('#cart').innerHTML='<div class="empty">The bill is empty. Tap an item to add it.</div>'}
    else $('#cart').innerHTML='<table><tbody>'+cart.map(function(l){
      var i=byId(l.id);
      return '<tr><td>'+esc(i.name)+'<br><small style="color:var(--muted)">'+money(i.price)+' each</small></td>'+
        '<td><span class="qty"><button data-dec="'+l.id+'" aria-label="Decrease">−</button><b>'+l.qty+'</b><button data-inc="'+l.id+'" aria-label="Increase">+</button></span></td>'+
        '<td class="n">'+money(i.price*l.qty)+'</td></tr>';
    }).join('')+'</tbody></table>';
    $('#grand').textContent=money(cartTotal());
    $('#checkout').disabled=!cart.length;
  }
  function addToCart(id){
    var i=byId(id),l=cart.find(function(x){return x.id===id});
    if(!i||i.stock<=0)return;
    if(l){if(l.qty>=i.stock){toast('Only '+i.stock+' of '+i.name+' in stock.');return}l.qty++}
    else cart.push({id:id,qty:1});
    renderCart();
  }
  function changeQty(id,d){
    var l=cart.find(function(x){return x.id===id}),i=byId(id);
    if(!l)return;
    if(d>0&&l.qty>=i.stock){toast('Only '+i.stock+' of '+i.name+' in stock.');return}
    l.qty+=d;
    if(l.qty<=0)cart=cart.filter(function(x){return x!==l});
    renderCart();
  }
  function checkout(){
    if(!cart.length)return;
    for(var k=0;k<cart.length;k++){
      var it=byId(cart[k].id);
      if(!it||it.stock<cart[k].qty){toast('Not enough stock for '+(it?it.name:'an item')+'.');return}
    }
    var lines=[],newlyLow=[];
    cart.forEach(function(l){
      var it=byId(l.id),was=it.stock<=it.min;
      it.stock-=l.qty;
      lines.push({name:it.name,price:it.price,qty:l.qty});
      if(!was&&it.stock<=it.min)newlyLow.push(it.name+' ('+it.stock+' left)');
    });
    var sale={no:state.seq++,ts:Date.now(),customer:$('#cust').value.trim()||'Walk-in customer',lines:lines,total:cartTotal()};
    state.sales.unshift(sale);
    save();
    cart=[];$('#cust').value='';
    renderAll();
    openReceipt(sale);
    if(newlyLow.length)toast('Running low: '+newlyLow.join(', '));
  }

  /* ---------- Receipt ---------- */
  function receiptHTML(s){
    return '<h3>'+esc(STORE_NAME)+'</h3><div class="c">Bill no. '+s.no+'<br>'+new Date(s.ts).toLocaleString('en-IN')+'</div>'+
      '<div>Customer: '+esc(s.customer)+'</div><hr>'+
      s.lines.map(function(l){
        return '<div>'+esc(l.name)+'</div><div class="l"><span>'+l.qty+' × '+money(l.price)+'</span><span>'+money(l.qty*l.price)+'</span></div>';
      }).join('')+
      '<hr><div class="l"><b>Total</b><b>'+money(s.total)+'</b></div><hr><div class="c">Thank you. Visit again.</div>';
  }
  function openReceipt(s){
    currentSale=s;
    $('#receiptView').innerHTML=receiptHTML(s);
    $('#modal').classList.add('open');
  }
  function printReceipt(){
    if(!currentSale)return;
    $('#printArea').innerHTML=receiptHTML(currentSale);
    try{window.print()}catch(e){toast('Printing is not available here. Open the page in a full browser tab.')}
  }

  /* ---------- Stock ---------- */
  function renderStock(){
    $('#stockBody').innerHTML=state.items.length?state.items.map(function(i){
      var s=status(i),label={ok:'In stock',low:'Low',out:'Out of stock'}[s];
      return '<tr><td>'+esc(i.name)+'<br><small style="color:var(--muted)">'+esc(i.code)+' · alert at '+i.min+'</small></td>'+
        '<td class="n">'+money(i.price)+'</td><td class="n">'+i.stock+'</td>'+
        '<td><span class="pill '+s+'">'+label+'</span></td>'+
        '<td><div style="display:flex;gap:4px;min-width:130px"><input type="number" min="1" step="1" placeholder="Qty" data-rs-in="'+i.id+'" aria-label="Quantity to add for '+esc(i.name)+'" style="width:70px"><button class="btn" data-rs="'+i.id+'">Add</button></div></td>'+
        '<td style="white-space:nowrap"><button class="btn" data-edit="'+i.id+'">Edit</button> <button class="btn danger" data-del="'+i.id+'">'+(delArm===i.id?'Confirm delete':'Delete')+'</button></td></tr>';
    }).join(''):'<tr><td colspan="6" class="empty">No items yet. Add your first item above.</td></tr>';
  }
  function resetForm(){
    editingId=null;
    ['#fName','#fCode','#fPrice','#fStock'].forEach(function(s){$(s).value=''});
    $('#fMin').value=5;
    $('#formTitle').textContent='Add an item';
    $('#saveItem').textContent='Save item';
    $('#cancelEdit').hidden=true;
  }
  function saveItem(){
    var name=$('#fName').value.trim(),price=parseFloat($('#fPrice').value),stock=parseInt($('#fStock').value,10),min=parseInt($('#fMin').value,10);
    if(!name||isNaN(price)||price<0||isNaN(stock)||stock<0||isNaN(min)||min<0){toast('Enter a name, a price, and stock and alert levels of 0 or more.');return}
    var code=$('#fCode').value.trim()||('ITM-'+(state.items.length+101));
    if(editingId){
      var it=byId(editingId);it.name=name;it.code=code;it.price=price;it.stock=stock;it.min=min;
      toast('Updated '+name+'.');
    }else{
      state.items.push({id:'i'+Date.now(),code:code,name:name,price:price,stock:stock,min:min});
      toast('Added '+name+'.');
    }
    save();resetForm();renderAll();
  }
  function startEdit(id){
    var i=byId(id);if(!i)return;
    editingId=id;
    $('#fName').value=i.name;$('#fCode').value=i.code;$('#fPrice').value=i.price;$('#fStock').value=i.stock;$('#fMin').value=i.min;
    $('#formTitle').textContent='Edit '+i.name;
    $('#saveItem').textContent='Update item';
    $('#cancelEdit').hidden=false;
    $('#fName').focus();window.scrollTo({top:0});
  }
  function restock(id){
    var inp=document.querySelector('[data-rs-in="'+id+'"]'),n=parseInt(inp.value,10);
    if(isNaN(n)||n<1){toast('Enter how many units arrived.');return}
    var i=byId(id);i.stock+=n;save();renderAll();toast('Added '+n+' to '+i.name+'. Now '+i.stock+'.');
  }
  function removeItem(id){
    if(delArm!==id){delArm=id;renderStock();return}
    state.items=state.items.filter(function(i){return i.id!==id});
    cart=cart.filter(function(l){return l.id!==id});
    delArm=null;save();renderAll();toast('Item deleted.');
  }

  /* ---------- Bills ---------- */
  function renderSales(){
    var start=new Date();start.setHours(0,0,0,0);
    var today=state.sales.filter(function(s){return s.ts>=start.getTime()});
    $('#stToday').textContent=money(today.reduce(function(t,s){return t+s.total},0));
    $('#stCount').textContent=today.length;
    $('#salesBody').innerHTML=state.sales.length?state.sales.map(function(s){
      return '<tr><td>#'+s.no+'</td><td>'+new Date(s.ts).toLocaleString('en-IN')+'</td><td>'+esc(s.customer)+'</td><td class="n">'+money(s.total)+'</td><td><button class="btn" data-view="'+s.no+'">View</button></td></tr>';
    }).join(''):'<tr><td colspan="5" class="empty">No bills yet. Your saved bills will show here.</td></tr>';
  }

  /* ---------- Wiring ---------- */
  function renderAll(){renderAlert();renderTiles();renderCart();renderStock();renderSales()}
  function showTab(t){
    ['bill','stock','sales'].forEach(function(n){$('#tab-'+n).hidden=n!==t});
    document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===t)});
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var d=b.dataset;
    if(d.tab)showTab(d.tab);
    else if(d.go)showTab(d.go);
    else if(d.add)addToCart(d.add);
    else if(d.inc)changeQty(d.inc,1);
    else if(d.dec)changeQty(d.dec,-1);
    else if(d.edit)startEdit(d.edit);
    else if(d.rs)restock(d.rs);
    else if(d.del)removeItem(d.del);
    else if(d.view){var s=state.sales.find(function(x){return x.no==d.view});if(s)openReceipt(s)}
    else if(b.id==='checkout')checkout();
    else if(b.id==='clear'){cart=[];renderCart()}
    else if(b.id==='saveItem')saveItem();
    else if(b.id==='cancelEdit')resetForm();
    else if(b.id==='printBtn')printReceipt();
    else if(b.id==='closeModal')$('#modal').classList.remove('open');
  });
  $('#search').addEventListener('input',renderTiles);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#modal').classList.remove('open')});
  load();renderAll();
})();
</script>
</body>
</html>
